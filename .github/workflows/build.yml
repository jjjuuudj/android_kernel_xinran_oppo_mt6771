name: 生产构建
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android11'
  KERNEL_VERSION: '4.14'
  KERNEL_NAME: 'ran'
on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      
      - name: 缓存 LLVM 工具链
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: llvm-23.1.2-${{ runner.os }}
          
      - name: 安装配置环境依赖
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            flex bison \
            dwarves \
            libssl-dev \
            libelf-dev \
            bc \
            python3 \
            python-is-python3 \
            make \
            cmake \
            zip \
            curl \
            wget \
            gnupg \
            gcc-multilib \
            g++-multilib \
            ccache \
            rsync \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf
          lscpu
          if [ ! -d aosp-clang ]; then
            wget -O LLVM-23.1.2-Linux-X64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-X64.tar.xz
            tar -xvaf LLVM-23.1.2-Linux-X64.tar.xz
            mv LLVM-23.1.2-Linux-X64 aosp-clang
            rm -rf ./LLVM-23.1.2-Linux-X64.tar.xz
          else
            echo "命中 LLVM 缓存，跳过下载"
          fi
          echo "AOSP_CLANG_PATH=$(pwd)/aosp-clang" >> $GITHUB_ENV
          echo "PATH=$(pwd)/aosp-clang/bin:$PATH" >> $GITHUB_ENV

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          git clone --depth=1 https://github.com/Winkmoon/android_kernel_xinran_oppo_mt6771 -b android11 common
          rm common/android/abi_gki_protected_exports_* || true
      
      - name: 添加制作名称
        run: |
          cd kernel_workspace/common
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            for f in ./arch/arm64/configs/oppo6771_defconfig; do
              sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-${{ github.event.inputs.kernel_suffix }}\"/" "$f"
            done
          fi

      - name: 追加 Droidspaces 内核配置 
        run: |
          cd kernel_workspace/common
          cat >> arch/arm64/configs/oppo6771_defconfig << 'EOF'

          # --- Droidspaces 必需配置 ---
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: 应用 Droidspaces 非 GKI 补丁
        run: |
          cd kernel_workspace/common
          rm -rf /tmp/droidspaces
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/droidspaces
          
          PATCH_DIR="/tmp/droidspaces/Documentation/resources/kernel-patches/non-GKI"
          
          if [ -d "$PATCH_DIR" ]; then
            for p in "$PATCH_DIR"/*.patch; do
              if [ -f "$p" ]; then
                echo "==> 正在应用: $(basename "$p")"
                # 优化：使用 git apply 避免生成 .rej 卡住，失败则用 patch -N 忽略已打过的
                git apply "$p" 2>/dev/null || patch -p1 -N < "$p" || echo "!! 补丁已存在或不适用，跳过"
              fi
            done
          else
            echo "::warning::未找到 non-GKI 补丁目录，检查 clone 路径"
          fi
      
      - name: 构建内核
        run: |
          cd kernel_workspace/common
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH=$AOSP_CLANG_PATH/bin:$PATH
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS="-Wno-error -Wno-deprecated-declarations"
          export KBUILD_BUILD_VERSION="0"
          export SOURCE_DATE_EPOCH=$(date +%s)
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=2G
          export CCACHE_COMPRESS=true
          export KBUILD_BUILD_USER=XinRan
          export KBUILD_BUILD_HOST=Bai
          
          # 清理可能带进来的旧缓存
          rm -rf out
          
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" BUILD_CONFIG=build.config.gki.aarch64 O=out DEPMOD=depmod TARGET_PRODUCT=full_oppo6771 oppo6771_defconfig
          
          make -j8 O=out ARCH=arm64 CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=full_oppo6771

          for f in out/vmlinux out/arch/arm64/boot/Image; do
            if [ ! -s "$f" ]; then
              echo "::error::构建产物缺失: $f —— 本次编译失败"
              exit 1
            fi
          done
          echo "内核构建成功 ✓"
      
      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace/common
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          
          # 【关键优化】优先打包 Image.gz-dtb 防止 37MB 的 Image 超过分区大小导致刷入失败
          if [ -s ../out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "==> 发现 Image.gz-dtb，使用它进行打包 (推荐)"
              cp ../out/arch/arm64/boot/Image.gz-dtb ./Image
          elif [ -s ../out/arch/arm64/boot/Image.gz ]; then
              echo "==> 发现 Image.gz，使用它进行打包"
              cp ../out/arch/arm64/boot/Image.gz ./Image
          else
              echo "==> 只找到 Image，使用它进行打包"
              cp ../out/arch/arm64/boot/Image ./Image
          fi
          
          ls -l ./Image
          sha256sum ./Image
          zip -r ../AnyKernel3_oppo6771.zip ./*
      
      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/common/*.zip