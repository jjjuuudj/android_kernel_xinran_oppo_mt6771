name: 生产构建
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android11'
  KERNEL_VERSION: '4.14'
  KERNEL_NAME: 'ran'
on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      
      - name: 缓存 LLVM 工具链
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: llvm-23.1.2-${{ runner.os }}
      - name: 安装配置环境依赖
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            flex bison \
            dwarves \
            libssl-dev \
            libelf-dev \
            bc \
            python3 \
            python-is-python3 \
            make \
            cmake \
            zip \
            curl \
            wget \
            gnupg \
            gcc-multilib \
            g++-multilib \
            ccache \
            rsync \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf
          lscpu
          if [ ! -d aosp-clang ]; then
            wget -O LLVM-23.1.2-Linux-X64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-X64.tar.xz
            tar -xvaf LLVM-23.1.2-Linux-X64.tar.xz
            mv LLVM-23.1.2-Linux-X64 aosp-clang
            rm -rf ./LLVM-23.1.2-Linux-X64.tar.xz
          else
            echo "命中 LLVM 缓存，跳过下载"
          fi
          echo "AOSP_CLANG_PATH=$(pwd)/aosp-clang" >> $GITHUB_ENV
          echo "PATH=$(pwd)/aosp-clang/bin:$PATH" >> $GITHUB_ENV
      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          git clone --depth=1 https://github.com/Winkmoon/android_kernel_xinran_oppo_mt6771 -b android11 common
          rm common/android/abi_gki_protected_exports_* || true
      
     # - name: 集成ReSukiSU
     #   id: ksu_version
     #   run: |
     #     cd kernel_workspace/common
     #     curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
     #     echo "CONFIG_KSU=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig
     #     echo "CONFIG_KSU_TOOLKIT_SUPPORT=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig
     #     echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig
     #     echo "CONFIG_KSU_TRACEPOINT_HOOK=y" >> ./arch/arm64/configs/xiaomi_diting_defconfig

      
      - name: 添加制作名称
        run: |
          cd kernel_workspace
          cd common
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            for f in ./arch/arm64/configs/oppo6771_defconfig; do
              sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-${{ github.event.inputs.kernel_suffix }}\"/" "$f"
            done
          fi

      - name: 追加 Droidspaces 内核配置
        run: |
          cd kernel_workspace/common
          cat >> arch/arm64/configs/oppo6771_defconfig << 'EOF'

          # --- Droidspaces 必需配置 ---
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: 应用 Droidspaces 非 GKI 补丁
        run: |
          cd kernel_workspace/common
          rm -rf /tmp/droidspaces
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/droidspaces
          
          PATCH_DIR="/tmp/droidspaces/Documentation/resources/kernel-patches/non-GKI"
          
          if [ -d "$PATCH_DIR" ]; then
            for p in "$PATCH_DIR"/*.patch; do
              if [ -f "$p" ]; then
                echo "==> 正在应用: $(basename "$p")"
                patch -p1 --forward < "$p" || echo "!! 补丁应用失败，继续"
              fi
            done
          else
            echo "::warning::未找到 non-GKI 补丁目录，检查 clone 路径"
            ls -la /tmp/droidspaces/Documentation/resources/kernel-patches/ || true
          fi
      
      - name: 缓存 ccache 编译产物
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: 缓存编译输出目录 out/
        uses: actions/cache@v4
        with:
          path: kernel_workspace/common/out
          key: out-${{ github.sha }}
          restore-keys: |
            out-

      - name: 清掉缓存带进来的旧成品（保留 .o 目标文件）
        run: |
          # out/ 缓存是为了复用编译好的 .o，但里面会带着上一次的 vmlinux / Image；
          # 如果这次构建失败，打包步骤就会把这个旧 Image 当成新内核打进去。
          rm -f kernel_workspace/common/out/vmlinux \
                kernel_workspace/common/out/arch/arm64/boot/Image \
                kernel_workspace/common/out/arch/arm64/boot/Image.gz \
                kernel_workspace/common/out/arch/arm64/boot/Image.lz4 \
                kernel_workspace/common/out/System.map \
                kernel_workspace/common/out/arch/arm64/boot/System.map
          echo "残余成品（应为空）:"; ls -l kernel_workspace/common/out/vmlinux kernel_workspace/common/out/arch/arm64/boot/Image 2>&1 || true

      - name: 构建内核
        run: |
          cd kernel_workspace/common
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH=$AOSP_CLANG_PATH/bin:$PATH
          export LLVM=1
          export LLVM_IAS=0
          export KCFLAGS="-Wno-error -Wno-deprecated-declarations"
          export KBUILD_BUILD_VERSION="0"
          export SOURCE_DATE_EPOCH=$(date +%s)
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=2G
          export CCACHE_COMPRESS=true
          export KBUILD_BUILD_USER=XinRan♡
          export KBUILD_BUILD_HOST=Bai
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" BUILD_CONFIG=build.config.gki.aarch64 O=out DEPMOD=depmod TARGET_PRODUCT=full_oppo6771 oppo6771_defconfig
          ## scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO
          make -j24 O=out ARCH=arm64 CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" LLVM=1 LLVM_IAS=1 TARGET_PRODUCT=full_oppo6771

          for f in out/vmlinux out/arch/arm64/boot/Image; do
            if [ ! -s "$f" ]; then
              echo "::error::构建产物缺失: $f —— 本次编译失败"
              exit 1
            fi
          done
          ls -l out/vmlinux out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image
          echo "内核构建成功 ✓"
      
      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          cd common
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          test -s ../out/arch/arm64/boot/Image || { echo "::error::out/ 里没有 Image，拒绝打包"; exit 1; }
          cp ../out/arch/arm64/boot/Image ./Image
          ls -l ./Image
          sha256sum ./Image
          zip -r ../AnyKernel3_xiaomi_diting.zip ./*
      
      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/common/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips
      
